name: Transfer verified 0.3.2 installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'sagegrid9418/mail-grid' && github.actor == 'sagegrid9418'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Transfer existing public installers with pinned SHA-256 and SHA-512
        shell: bash
        run: |
          python3 - <<'PYTRANSFER'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          repo='repos/sagegrid9418/mail-grid'
          release_id=434751697
          pins=[{'name': 'mail-grid_0.3.2_amd64.deb', 'url': '/downloads/0.3.2/mail-grid_0.3.2_amd64.deb', 'size': 140635560, 'sha256': 'f030a31f9312855b5685c5bf924b46bdd9ac3de545e683f6d1ac741f39986f52', 'sha512': '8Bd6mr2dazXaZ4ey4auFPBt6S2utGuzbeAxUdbCm3iJTN4gyCjZwOXIKbWjQZpeq0TIjOCbPmpxeEMDweqWHbQ==', 'roles': ['installer', 'update']}, {'name': 'Mail-Grid-0.3.2-Windows-x64-Setup.exe', 'url': '/downloads/0.3.2/Mail-Grid-0.3.2-Windows-x64-Setup.exe', 'size': 174532184, 'sha256': '6362c52e5340845e004e366754c6a3ea721021220228df425cefcfab569687ec', 'sha512': '8Y5nYg5SA/Ol/GT77jCikaEDVp+GcbH8U2NA8BUWV60eJunLdp5vZaXbay1uNdmMUexFetmdcoaWrK2fT3l8HA==', 'roles': ['installer', 'update']}, {'name': 'Mail-Grid-0.3.2-macOS-Universal.dmg', 'url': '/downloads/0.3.2/Mail-Grid-0.3.2-macOS-Universal.dmg', 'size': 257961265, 'sha256': '81ae4a30dc644b75f84588e212b426d86e05599cfd72802693327c9110004ea8', 'sha512': 'xthp0ieqWglJSCSoRpXHHCxFQ/qj0o5ZxHrWX/xyc247K1l7YlOap14YelZhzKsFHAqq/mGZOKvQrv0qkzYbEg==', 'roles': ['installer', 'update']}]
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'mailgrid-release-transfer'
          folder.mkdir(exist_ok=True)
          def api(endpoint,*args):
           value=subprocess.check_output(['gh','api',endpoint,*args],text=True)
           return json.loads(value) if value.strip() else None
          assert api(f'{repo}/releases/{release_id}')['draft'], 'Release must remain a draft'
          for file in pins:
           name=file['name'];target=folder/name
           assert pathlib.PurePath(name).name==name
           request=urllib.request.Request('https://mail-dev.sagegrid.org'+file['url'],headers={'Accept-Encoding':'identity'})
           size=0;sha256=hashlib.sha256();sha512=hashlib.sha512()
           with urllib.request.urlopen(request,timeout=120) as response,target.open('wb') as output:
            assert response.status==200
            while chunk:=response.read(1024*1024):
             size+=len(chunk);assert size<=file['size'];output.write(chunk);sha256.update(chunk);sha512.update(chunk)
           assert size==file['size'] and sha256.hexdigest()==file['sha256'] and base64.b64encode(sha512.digest()).decode()==file['sha512'], 'Installer hash mismatch'
           print('Verified public website installer:',name,flush=True)
           release=api(f'{repo}/releases/{release_id}');assert release['draft']
           previous=next((a for a in release['assets'] if a['name']==name),None)
           if previous and previous['state']=='uploaded':
            assert previous['size']==size and previous['digest']=='sha256:'+file['sha256'];continue
           if previous:
            assert previous['state']=='starter';api(f"{repo}/releases/assets/{previous['id']}",'--method','DELETE')
           subprocess.run(['gh','release','upload','v0.3.2','--repo','sagegrid9418/mail-grid',str(target)],check=True)
           uploaded=next(a for a in api(f'{repo}/releases/{release_id}')['assets'] if a['name']==name)
           assert uploaded['state']=='uploaded' and uploaded['size']==size and uploaded['digest']=='sha256:'+file['sha256']
           print('GitHub asset verified:',name,flush=True)
          print('All installers transferred. Release remains a draft for final verification.',flush=True)
          PYTRANSFER
